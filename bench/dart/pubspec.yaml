name: darudb_bench
description: Runs the workloads of bench/README.md against DaruDB and other embedded stores, from Dart.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  darudb:
    path: ../../packages/dart/darudb
  hive_ce: ^2.20.2
  sqlite3: ^3.7.0

dev_dependencies:
  build_runner: ^2.10.0
  darudb_generator:
    path: ../../packages/dart/darudb_generator
