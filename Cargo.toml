[workspace]
resolver = "3"
members = ["crates/darudb", "crates/darudb-derive", "packages/dart/darudb/native", "packages/node"]

# What every crate in the repository shares. The version is not here: each
# package versions on its own, so each manifest carries its own number.
[workspace.package]
edition = "2024"
# The oldest compiler a consumer of the published crates may build with. The
# compiler this repository builds with is pinned separately, in
# `rust-toolchain.toml`.
rust-version = "1.85"
license = "MIT"
authors = ["CDGet <jooy2.contact@gmail.com>"]
repository = "https://github.com/jooy2/darudb"
homepage = "https://darudb.cdget.com"

[workspace.dependencies]
darudb = { path = "crates/darudb", version = "1.0.0" }
darudb-derive = { path = "crates/darudb-derive", version = "=1.0.0" }
tempfile = "3.27.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls"] }
twox-hash = { version = "2.1.4", default-features = false, features = ["std", "xxhash3_128"] }
getrandom = "0.4.3"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
xaes-256-gcm = { version = "0.1.0", default-features = false, features = ["zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
zeroize = "1.9.0"
blake2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
libc = { version = "0.2.189", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_WindowsProgramming"] }

# Applies to what this workspace builds, which in practice means the Node.js
# addon: a consumer of the `darudb` crate builds with its own profile.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Debug builds of the engine and its dependencies are optimized. The cipher's
# generic code is compiled into the engine itself, and unoptimized it makes the
# crash suites forty times slower. Debug assertions and overflow checks stay
# on, as in any debug build.
[profile.dev.package.darudb]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
