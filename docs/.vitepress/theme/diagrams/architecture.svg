<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440">
  <defs>
    <marker id="architecture-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z" />
    </marker>
  </defs>

  <rect class="box" x="16" y="16" width="160" height="56" rx="8" />
  <text class="strong" x="96" y="40" text-anchor="middle">Rust</text>
  <text class="note" x="96" y="58" text-anchor="middle">the crate's own API</text>

  <rect class="box" x="192" y="16" width="160" height="56" rx="8" />
  <text class="strong" x="272" y="40" text-anchor="middle">Node.js</text>
  <text class="note" x="272" y="58" text-anchor="middle">napi-rs addon</text>

  <rect class="box" x="368" y="16" width="160" height="56" rx="8" />
  <text class="strong" x="448" y="40" text-anchor="middle">Dart</text>
  <text class="note" x="448" y="58" text-anchor="middle">dart:ffi and a build hook</text>

  <rect class="box" x="544" y="16" width="160" height="56" rx="8" />
  <text class="strong" x="624" y="40" text-anchor="middle">Python</text>
  <text class="note" x="624" y="58" text-anchor="middle">PyO3 extension module</text>

  <path class="line" d="M96 72V110" marker-end="url(#architecture-head)" />
  <path class="line" d="M272 72V110" marker-end="url(#architecture-head)" />
  <path class="line" d="M448 72V110" marker-end="url(#architecture-head)" />
  <path class="line" d="M624 72V110" marker-end="url(#architecture-head)" />

  <rect class="frame soft" x="16" y="112" width="688" height="232" rx="12" />
  <text class="strong" x="36" y="138">The engine, written in Rust</text>
  <text class="note" x="684" y="138" text-anchor="end">every rule about the file, in one place</text>

  <rect class="box" x="36" y="154" width="480" height="36" rx="6" />
  <text x="52" y="177">Objects, schemas, migrations and queries</text>
  <text class="note code" x="500" y="177" text-anchor="end">schema/ query/</text>

  <rect class="box" x="36" y="198" width="480" height="36" rx="6" />
  <text x="52" y="221">Transactions, snapshots and recovery</text>
  <text class="note code" x="500" y="221" text-anchor="end">txn/</text>

  <rect class="box" x="36" y="242" width="480" height="36" rx="6" />
  <text x="52" y="265">Copy-on-write B+tree</text>
  <text class="note code" x="500" y="265" text-anchor="end">btree/</text>

  <rect class="box" x="36" y="286" width="480" height="36" rx="6" />
  <text x="52" y="309">Pages: cache, checks and encryption</text>
  <text class="note code" x="500" y="309" text-anchor="end">storage/ crypto/</text>

  <rect class="box" x="532" y="154" width="152" height="168" rx="6" />
  <text class="strong" x="608" y="214" text-anchor="middle">Locks between</text>
  <text class="strong" x="608" y="232" text-anchor="middle">processes</text>
  <text class="note" x="608" y="256" text-anchor="middle">the operating system's</text>
  <text class="note" x="608" y="272" text-anchor="middle">byte-range locks</text>
  <text class="note code" x="608" y="296" text-anchor="middle">lock/</text>

  <path class="line" d="M360 344V374" marker-end="url(#architecture-head)" />
  <path class="line later" d="M608 322V400H452" marker-end="url(#architecture-head)" />

  <rect class="box accent" x="270" y="376" width="180" height="48" rx="8" />
  <text class="strong code" x="360" y="397" text-anchor="middle">app.darudb</text>
  <text class="note" x="360" y="414" text-anchor="middle">one file on disk</text>
</svg>
