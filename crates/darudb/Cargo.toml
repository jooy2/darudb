[package]
name = "darudb"
version = "1.0.1"
description = "An embedded database that keeps an application's data in one local file."
readme = "README.md"
keywords = ["database", "embedded", "storage", "encryption"]
categories = ["database-implementations"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# XXH3-128, the check of a plain page. MIT, and with these features it pulls in
# nothing else.
twox-hash.workspace = true
# Random file ids and temporary file names, from the operating system.
# MIT OR Apache-2.0.
getrandom.workspace = true
# XChaCha20-Poly1305, one of the two page ciphers and the cipher of the key
# block. Apache-2.0 OR MIT.
chacha20poly1305.workspace = true
# XAES-256-GCM, the page cipher on processors with AES instructions.
# Apache-2.0 OR MIT.
xaes-256-gcm.workspace = true
# Argon2id, which turns a password into the key that unwraps the data key.
# MIT OR Apache-2.0.
argon2.workspace = true
# Wipes keys from memory when they are dropped. Apache-2.0 OR MIT.
zeroize.workspace = true
# Keyed BLAKE2b, the MAC of an encrypted file's commit records. Argon2id
# builds on it already. MIT OR Apache-2.0.
blake2.workspace = true

# `#[derive(Object)]` and `#[derive(Embedded)]`, with the `derive` feature.
# The project's own crate; it brings `syn`, `quote` and `proc-macro2`, MIT OR
# Apache-2.0, at build time only.
darudb-derive = { workspace = true, optional = true }

[features]
# The derive macros, off by default so that a program that does not use them
# does not build a Rust parser.
derive = ["dep:darudb-derive"]

[target.'cfg(unix)'.dependencies]
# The C library's `fcntl` record locks, which the standard library does not
# expose: it locks whole files only. `fstatfs` tells a network file system
# apart. MIT OR Apache-2.0, with no dependencies, and already in the build
# through `getrandom`.
libc.workspace = true
# `pwritev`, a positional write of several buffers, which the standard
# library offers only on nightly: a commit writes each run of consecutive
# pages from where the pages lie rather than copying them into one buffer
# first. Also the rename that never replaces a file, `renameat2` on Linux and
# `renameatx_np` on Apple systems, where a file system has no links. Safe, so
# no module of ours needs `unsafe` for either, and it finds `pwritev` at run
# time on macOS, where it arrived in version 11. Apache-2.0 WITH
# LLVM-exception OR Apache-2.0 OR MIT; it brings `bitflags`, and on Linux
# `linux-raw-sys`, both MIT OR Apache-2.0.
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# `LockFileEx` and `UnlockFileEx`, the byte-range locks of Windows, and
# `GetDriveTypeW`, which tells a network drive apart. MIT OR Apache-2.0,
# published by Microsoft, and it brings only `windows-link`.
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The integration tests of typed objects derive their types with it, so that
# they run without the `derive` feature.
darudb-derive.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints.rust]
# The engine is safe Rust, with one exception: `sys/` makes the operating
# system's calls that the standard library does not offer, such as byte-range
# locks, and allows `unsafe` for itself alone. Any other module that uses it
# fails to build. `deny` rather than `forbid` is what lets that one module opt
# out.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
# A database file is untrusted input, and a damaged one must produce an error
# rather than a panic. These two catch the easiest way to write a panic by
# accident. Tests may still use both; see `clippy.toml` at the root.
unwrap_used = "warn"
expect_used = "warn"
# Offsets and lengths move between `u64` (the file), `usize` (memory) and `u32`
# (the header). A silent truncation between them is a corrupted file.
cast_possible_truncation = "warn"
# Every `unsafe` block says why it is sound, and does one unsafe thing, so
# that the reason covers all of it.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
