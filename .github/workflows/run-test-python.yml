name: run-test-python

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      # The extension is the engine compiled in, so a change to either is a
      # change to what these tests load.
      - crates/**
      - packages/python/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/run-test-python.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./packages/python

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and type-check

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # mypy reads the native module's stub, so nothing needs building.
      - run: pip install ruff mypy
      - name: Lint
        run: ruff check python tests tool
      - name: Check formatting
        run: ruff format --check python tests tool
      - name: Type-check
        run: mypy

  run-test-python:
    runs-on: ${{ matrix.os }}
    name: Test Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported CPython on Linux, the oldest and the newest on the
        # other two, and the free-threaded build everywhere, which loads a
        # wheel of its own rather than the stable ABI's.
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.14' }
          - { os: ubuntu-latest, python: 3.14t }
          - { os: macos-latest, python: '3.11' }
          - { os: macos-latest, python: '3.14' }
          - { os: macos-latest, python: 3.14t }
          - { os: windows-latest, python: '3.11' }
          - { os: windows-latest, python: '3.14' }
          - { os: windows-latest, python: 3.14t }

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.python }}
      - run: python -m pip install maturin pytest
      # A debug build of the extension, with the engine optimized as the
      # workspace's profile says, which is quicker to build than a release.
      - name: Build the wheel
        run: maturin build --out dist --interpreter "${{ steps.python.outputs.python-path }}"
      - name: Install it
        run: python -m pip install --no-index --find-links dist darudb
      - name: Test
        run: python -m pytest
