name: release

# Builds one package for release and, only when asked, publishes it. Without
# `publish`, it builds and tests everything that would be published, checks
# what each package would contain, and publishes nothing: that is the dry run
# to make before every release. CONTRIBUTING.md has the whole procedure.
#
# A Dart package's first version is published by hand from what a run started
# here prepares, since pub.dev takes automated publishing only for a package it
# has. After that, pushing the tag of a Dart package's version starts a run
# that publishes it: pub.dev takes a package only from a run a tag push
# started, so for those packages the push is the request to publish.
on:
  workflow_dispatch:
    inputs:
      package:
        description: The package to release
        type: choice
        options:
          - npm
          - crate
          - dart
          - dart-generator
          - python
      publish:
        description: Publish it. Off, the run publishes nothing.
        type: boolean
        default: false
  push:
    tags:
      - 'dart-v*'
      - 'dart-generator-v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    name: Check the version
    outputs:
      package: ${{ steps.package.outputs.package }}
      publish: ${{ steps.package.outputs.publish }}
      version: ${{ steps.package.outputs.version }}
      changelog: ${{ steps.package.outputs.changelog }}
      tag: ${{ steps.package.outputs.tag }}
      title: ${{ steps.package.outputs.title }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # A tag push names the package by its tag, and always publishes.
      - name: Read the package's version
        id: package
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$EVENT" = push ]; then
            case "$REF_NAME" in
              dart-generator-v*) PACKAGE=dart-generator ;;
              dart-v*) PACKAGE=dart ;;
              *) echo "::error::$REF_NAME is not the tag of a package"; exit 1 ;;
            esac
            publish=true
          else
            PACKAGE=$INPUT_PACKAGE
            publish=$INPUT_PUBLISH
          fi

          if [ "$PACKAGE" = npm ]; then
            version=$(node -p "require('./packages/node/package.json').version")
            echo "changelog=packages/node/CHANGELOG.md" >> "$GITHUB_OUTPUT"
            echo "tag=node-v$version" >> "$GITHUB_OUTPUT"
            echo "title=darudb $version for Node.js" >> "$GITHUB_OUTPUT"
          elif [ "$PACKAGE" = dart ]; then
            version=$(sed -n 's/^version: \(.*\)$/\1/p' packages/dart/darudb/pubspec.yaml)
            echo "changelog=packages/dart/darudb/CHANGELOG.md" >> "$GITHUB_OUTPUT"
            echo "tag=dart-v$version" >> "$GITHUB_OUTPUT"
            echo "title=darudb $version for Dart" >> "$GITHUB_OUTPUT"
          elif [ "$PACKAGE" = python ]; then
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/python/pyproject.toml | head -n 1)
            echo "changelog=packages/python/CHANGELOG.md" >> "$GITHUB_OUTPUT"
            echo "tag=python-v$version" >> "$GITHUB_OUTPUT"
            echo "title=darudb $version for Python" >> "$GITHUB_OUTPUT"
          elif [ "$PACKAGE" = dart-generator ]; then
            version=$(sed -n 's/^version: \(.*\)$/\1/p' packages/dart/darudb_generator/pubspec.yaml)
            echo "changelog=packages/dart/darudb_generator/CHANGELOG.md" >> "$GITHUB_OUTPUT"
            echo "tag=dart-generator-v$version" >> "$GITHUB_OUTPUT"
            echo "title=darudb_generator $version" >> "$GITHUB_OUTPUT"
          else
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/darudb/Cargo.toml | head -n 1)
            echo "changelog=crates/darudb/CHANGELOG.md" >> "$GITHUB_OUTPUT"
            echo "tag=darudb-v$version" >> "$GITHUB_OUTPUT"
            echo "title=darudb $version for Rust" >> "$GITHUB_OUTPUT"
          fi

          if [ "$EVENT" = push ] && ! grep -Fqx "tag=$REF_NAME" "$GITHUB_OUTPUT"; then
            echo "::error::$REF_NAME does not name the version the package has, $version"
            exit 1
          fi

          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A release renames the changelog's `vNext` section to the version and
      # its date. Publishing without that would ship an entry-less release.
      - name: Check that the changelog names the version
        if: steps.package.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
          CHANGELOG: ${{ steps.package.outputs.changelog }}
        run: |
          heading=$(grep -m 1 '^## ' "$CHANGELOG")

          if ! printf '%s\n' "$heading" | grep -Eq "^## v${VERSION//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$"; then
            echo "::error::$CHANGELOG opens with \"$heading\", not the release of $VERSION and its date"
            exit 1
          fi

  crate:
    if: needs.version.outputs.package == 'crate'
    needs: version
    runs-on: ubuntu-latest
    name: Package the crate

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p darudb -p darudb-derive --all-features
      # Builds the crates from the files they would publish, as a consumer
      # would. `darudb` depends on exactly this version of `darudb-derive`,
      # so the two are packaged and published together, the macros first.
      - name: Package
        run: cargo publish -p darudb-derive -p darudb --dry-run

  # Publishes through crates.io's trusted publishing: crates.io trusts this
  # workflow of this repository, and gives the run a token that lasts minutes
  # and is revoked when the job ends, so the repository keeps no crates.io
  # secret. Its own job, so that the job that builds third-party code never
  # holds the permission to ask for that token, and `--no-verify`, because
  # `crate` built the packaged crates already, and building them again here
  # would run build scripts with the token at hand.
  crate-publish:
    if: needs.version.outputs.package == 'crate' && needs.version.outputs.publish == 'true'
    needs: [version, crate]
    runs-on: ubuntu-latest
    name: Publish the crates
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish -p darudb-derive -p darudb --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    if: needs.version.outputs.package == 'npm'
    needs: version
    runs-on: ${{ matrix.host }}
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Every target in `napi.targets` of packages/node/package.json but
        # FreeBSD, which builds below. `test` runs the package's tests on the
        # addon built, where the runner can run it.
        include:
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin, test: true }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { host: windows-latest, target: i686-pc-windows-msvc }
          - { host: windows-latest, target: aarch64-pc-windows-msvc }
          # napi-rs's cross toolchain builds against glibc 2.17, so the addon
          # loads on old Linux systems too. Its GCC for arm64 and armv7 is
          # older than an option mimalloc's build passes, so those two compile
          # C with the runner's clang, against the toolchain's glibc 2.17
          # headers, which the napi CLI hands clang when `TARGET_CC` names it.
          - {
              host: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              flags: --use-napi-cross,
              test: true
            }
          - {
              host: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              flags: --use-napi-cross,
              cc: clang
            }
          - {
              host: ubuntu-latest,
              target: armv7-unknown-linux-gnueabihf,
              flags: --use-napi-cross,
              cc: clang
            }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: -x }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: -x }
          # The runner's Android NDK, which the napi CLI finds by itself.
          - { host: ubuntu-latest, target: aarch64-linux-android }
          - { host: ubuntu-latest, target: armv7-linux-androideabi }

    defaults:
      run:
        shell: bash
        working-directory: ./packages/node

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      # The first `cargo` command installs the toolchain `rust-toolchain.toml`
      # pins, and the target is added to that toolchain.
      - name: Add the target
        run: |
          cargo --version
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The musl targets link through Zig, with its C compiler for mimalloc.
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'musl')
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild
      - run: npm ci
      - name: Build
        env:
          CC_OF_TARGET: ${{ matrix.cc }}
        run: |
          if [ -n "$CC_OF_TARGET" ]; then
            export TARGET_CC="$CC_OF_TARGET"
          fi

          npx napi build --platform --release --target ${{ matrix.target }} ${{ matrix.flags }} --js native.js --dts native.d.ts
      # The addon is meant to load on glibc 2.17; a symbol versioned for a
      # newer glibc would keep it from loading there.
      - name: Check the newest glibc the addon needs
        if: contains(matrix.target, 'linux-gnu')
        run: |
          newest=$(readelf --version-info --wide darudb.*.node | grep -o 'GLIBC_[0-9.]*' | cut -c7- | sort -V | tail -n 1)
          echo "The addon needs glibc $newest"
          if [ "$(printf '%s\n' "$newest" 2.17 | sort -V | tail -n 1)" != 2.17 ]; then
            echo "::error::The addon needs glibc $newest, newer than 2.17"
            exit 1
          fi
      - name: Test
        if: matrix.test
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: packages/node/darudb.*.node
          if-no-files-found: error
      # The loader and its declarations are the same for every target, and
      # the package ships one copy.
      - uses: actions/upload-artifact@v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: loader
          path: |
            packages/node/native.js
            packages/node/native.d.ts
          if-no-files-found: error

  build-freebsd:
    if: needs.version.outputs.package == 'npm'
    needs: version
    runs-on: ubuntu-latest
    name: Build x86_64-unknown-freebsd

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build in a FreeBSD machine
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 8G
          cpu_count: 3
          shell: bash
          run: |
            sudo pkg install -y -f curl node npm
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain none
            source "$HOME/.cargo/env"
            cd packages/node
            cargo --version
            npm ci
            npx napi build --platform --release --target x86_64-unknown-freebsd --js native.js --dts native.d.ts
            rm -rf node_modules ../../target
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-x86_64-unknown-freebsd
          path: packages/node/darudb.*.node
          if-no-files-found: error

  npm:
    if: needs.version.outputs.package == 'npm'
    needs: [version, build, build-freebsd]
    runs-on: ubuntu-latest
    name: Package for npm

    defaults:
      run:
        working-directory: ./packages/node

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: packages/node/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: loader
          path: packages/node
      # One package per platform, each with its addon, this package's
      # licence and the notices of the crates linked into the addon.
      - name: Make the platform packages
        run: |
          npx napi create-npm-dirs
          npx napi artifacts
          node scripts/notices.mjs
      - name: Build the JavaScript
        run: npm run build:ts
      # Fails if any platform package lacks its addon.
      - name: Check every package is complete
        run: npx napi pre-publish -t npm --no-gh-release --dry-run
      # The tarballs `npm-publish` publishes, which list what each package
      # contains: one per platform, and this package, with every platform
      # package at this version as an optional dependency, as napi's
      # `pre-publish` would add them.
      - name: Pack every package
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const names = fs.readdirSync('npm').sort().map((dir) => require('./npm/' + dir + '/package.json').name);
            pkg.optionalDependencies = Object.fromEntries(names.map((name) => [name, pkg.version]));
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\\n');
          "
          mkdir tarballs

          for dir in npm/*/; do
            (cd "$dir" && npm pack --pack-destination ../../tarballs)
          done

          npm pack --ignore-scripts --pack-destination tarballs
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: packages/node/tarballs/*.tgz
          if-no-files-found: error

  # Publishes through npm's trusted publishing: each package trusts this
  # workflow of this repository, so npm takes the run's OIDC token in place of
  # a secret, and signs a provenance statement that ties each package to this
  # run. Its own job, so that the job that installs and builds third-party
  # code never holds the permission to ask for that token; this one only
  # publishes the tarballs `npm` packed. A package version npm has already is
  # skipped, so a run that failed part of the way can run again.
  npm-publish:
    if: needs.version.outputs.package == 'npm' && needs.version.outputs.publish == 'true'
    needs: [version, npm]
    runs-on: ubuntu-latest
    name: Publish to npm
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./tarballs

    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        working-directory: .
        run: npm install --global npm@11
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: tarballs
      # The platform packages first, so that `darudb` never names a package
      # npm does not have yet.
      - name: Publish
        run: |
          publish() {
            spec=$(tar -xOzf "$1" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")

            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is on npm already"
            else
              npm publish "$1" --access public --provenance
            fi
          }

          for tarball in darudb-darudb-*.tgz; do
            publish "$tarball"
          done

          publish darudb-[0-9]*.tgz

  build-dart:
    if: needs.version.outputs.package == 'dart'
    needs: version
    runs-on: ${{ matrix.host }}
    name: Build the Dart library for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Every target in packages/dart/darudb/native/rust-toolchain.toml,
        # since the manifest of a release needs a library for each. `test`
        # runs the package's tests on the library built, where the runner
        # can load it.
        include:
          - {
              host: macos-latest,
              target: aarch64-apple-darwin,
              file: libdarudb_dart.dylib,
              test: true
            }
          - { host: macos-latest, target: x86_64-apple-darwin, file: libdarudb_dart.dylib }
          - { host: macos-latest, target: aarch64-apple-ios, file: libdarudb_dart.dylib }
          - { host: macos-latest, target: aarch64-apple-ios-sim, file: libdarudb_dart.dylib }
          - { host: macos-latest, target: x86_64-apple-ios, file: libdarudb_dart.dylib }
          - {
              host: windows-latest,
              target: x86_64-pc-windows-msvc,
              file: darudb_dart.dll,
              test: true
            }
          - { host: windows-latest, target: aarch64-pc-windows-msvc, file: darudb_dart.dll }
          - {
              host: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              file: libdarudb_dart.so,
              test: true
            }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, file: libdarudb_dart.so }
          - { host: ubuntu-latest, target: aarch64-linux-android, file: libdarudb_dart.so }
          - { host: ubuntu-latest, target: armv7-linux-androideabi, file: libdarudb_dart.so }
          - { host: ubuntu-latest, target: x86_64-linux-android, file: libdarudb_dart.so }

    defaults:
      run:
        shell: bash

    env:
      # The oldest systems Flutter builds for, so that the library loads
      # wherever an application does.
      MACOSX_DEPLOYMENT_TARGET: '10.14'
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The first `cargo` command installs the toolchain `rust-toolchain.toml`
      # pins, and the target is added to that toolchain.
      - name: Add the target
        run: |
          cargo --version
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dart-${{ matrix.target }}
      # Linux builds link through Zig against glibc 2.17, so that the library
      # loads on old Linux systems too.
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'linux-gnu')
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'linux-gnu')
        with:
          tool: cargo-zigbuild
      # Android builds link with the runner's NDK, for API level 21, with the
      # 16 KB page alignment Android 15 requires.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          FILE: ${{ matrix.file }}
        run: |
          case "$TARGET" in
            *-linux-gnu)
              cargo zigbuild --release -p darudb-dart --target "$TARGET.2.17"
              ;;
            *-android*)
              tools="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
              linker="${TARGET/armv7-linux-androideabi/armv7a-linux-androideabi}21-clang"
              variable="CARGO_TARGET_$(printf '%s' "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER"
              export "$variable=$tools/$linker"
              RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384' cargo build --release -p darudb-dart --target "$TARGET"
              ;;
            *)
              cargo build --release -p darudb-dart --target "$TARGET"
              ;;
          esac

          mkdir -p libraries
          cp "target/$TARGET/release/$FILE" "libraries/darudb_dart-$TARGET.${FILE##*.}"
      # The oldest system each library loads on, as it declares it: glibc
      # 2.17 on Linux, and on Apple systems the deployment targets above, or
      # the first release of the system on Apple silicon where that is later.
      # The run-test-platforms workflow runs the engine on the oldest systems
      # it can reach.
      - name: Check the oldest system the library supports
        env:
          TARGET: ${{ matrix.target }}
        run: |
          library=$(ls libraries/*)

          case "$TARGET" in
            *-linux-gnu)
              newest=$(readelf --version-info --wide "$library" | grep -o 'GLIBC_[0-9.]*' | cut -c7- | sort -V | tail -n 1)
              echo "The library needs glibc $newest"
              if [ "$(printf '%s\n' "$newest" 2.17 | sort -V | tail -n 1)" != 2.17 ]; then
                echo "::error::The library needs glibc $newest, newer than 2.17"
                exit 1
              fi
              ;;
            *-apple-*)
              case "$TARGET" in
                x86_64-apple-darwin) expected=10.14 ;;
                aarch64-apple-darwin) expected=11.0 ;;
                aarch64-apple-ios-sim) expected=14.0 ;;
                *) expected=13.0 ;;
              esac
              minos=$(vtool -show-build "$library" | awk '/minos/ { print $2 }')
              echo "The library declares $minos as the oldest system it supports"
              if [ "$minos" != "$expected" ]; then
                echo "::error::The library declares $minos, not $expected"
                exit 1
              fi
              ;;
          esac
      - uses: actions/setup-python@v6
        if: matrix.test
        with:
          python-version: '3.13'
      - uses: dart-lang/setup-dart@v1
        if: matrix.test
      # The package's tests, with the build hook downloading this library
      # from a local server and checking its hash, as a published copy of
      # the package does with the release's.
      - name: Test the library through the build hook
        if: matrix.test
        working-directory: packages/dart/darudb
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # The server writes nowhere the step reads, or it would hold the
          # step open after the tests end.
          python -m http.server 8765 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE/libraries" > /dev/null 2>&1 &
          python - <<'SCRIPT'
          import hashlib, json, os, pathlib

          target = os.environ['TARGET']
          library = next(pathlib.Path(os.environ['GITHUB_WORKSPACE'], 'libraries').iterdir())
          pathlib.Path('hook/prebuilt.json').write_text(json.dumps({
              'base': 'http://127.0.0.1:8765/',
              'libraries': {target: {
                  'file': library.name,
                  'sha256': hashlib.sha256(library.read_bytes()).hexdigest(),
              }},
          }))
          SCRIPT
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          dart test --exclude-tags checkout
      - uses: actions/upload-artifact@v7
        with:
          name: dart-library-${{ matrix.target }}
          path: libraries/*
          if-no-files-found: error

  dart:
    if: needs.version.outputs.package == 'dart'
    needs: [version, build-dart]
    runs-on: ubuntu-latest
    name: Package for pub.dev

    defaults:
      run:
        working-directory: ./packages/dart/darudb

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v8
        with:
          pattern: dart-library-*
          merge-multiple: true
          path: libraries
      - run: dart pub get
      # The copy of the package that is published downloads these libraries
      # from the GitHub release this run makes, and checks them against the
      # hashes written here.
      - name: Write the manifest of the libraries
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          dart --packages=.dart_tool/package_config.json tool/prebuilt_manifest.dart \
            "$GITHUB_WORKSPACE/libraries" "https://github.com/$REPOSITORY/releases/download/$TAG/"
          cat hook/prebuilt.json
      # The tests' dependency on the generator is a path into the repository,
      # which the copy that is published, away from the repository, could not
      # resolve. Pub reports warnings, such as a changelog that does not name
      # the version yet, with the same exit code as errors, so only an error
      # fails the run.
      - name: List what the package would contain
        run: |
          dart pub remove darudb_generator
          dart pub publish --dry-run 2>&1 | tee publish.log || true

          if grep -q 'found the following .*error' publish.log; then
            exit 1
          fi

          rm publish.log
      # The package as it is published: by the `pub-dev` job after a tag
      # push, or by the maintainer with `dart pub publish`, once the GitHub
      # release holds its libraries.
      # Hidden files included: `.pubignore` is what leaves the Rust crate,
      # the tests and the tooling out of the published package.
      - uses: actions/upload-artifact@v7
        with:
          name: dart-package
          path: |
            packages/dart/darudb
            !packages/dart/darudb/.dart_tool
            !packages/dart/darudb/pubspec.lock
          include-hidden-files: true
          if-no-files-found: error

  dart-generator:
    if: needs.version.outputs.package == 'dart-generator'
    needs: version
    runs-on: ubuntu-latest
    name: Package the generator for pub.dev

    defaults:
      run:
        working-directory: ./packages/dart/darudb_generator

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      # The tests use the runtime package, whose build hook compiles the
      # engine with the toolchain its `rust-toolchain.toml` pins.
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      # The tests' dependency on the runtime package is a path into the
      # repository, as the runtime package's on this one is.
      - name: List what the package would contain
        run: |
          dart pub remove darudb
          dart pub publish --dry-run 2>&1 | tee publish.log || true

          if grep -q 'found the following .*error' publish.log; then
            exit 1
          fi

          rm publish.log
      - uses: actions/upload-artifact@v7
        with:
          name: dart-generator-package
          path: |
            packages/dart/darudb_generator
            !packages/dart/darudb_generator/.dart_tool
            !packages/dart/darudb_generator/pubspec.lock
          if-no-files-found: error

  build-python:
    if: needs.version.outputs.package == 'python'
    needs: version
    runs-on: ${{ matrix.host }}
    name: Build the Python wheels for ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # Each platform builds on a runner of its own architecture, so that
        # its wheels are tested where they were built. Each gets the stable
        # ABI's wheel, for every CPython from 3.11, and the free-threaded
        # 3.14's, which the stable ABI does not cover; 32-bit Windows gets
        # the stable ABI's alone. Linux builds in the PyPA's containers:
        # manylinux2014 is glibc 2.17, the oldest the engine supports. The
        # musllinux ones are named, since maturin-action's own choice for musl
        # is a cross-compiling image without the PyPA's interpreters.
        include:
          - {
              host: ubuntu-latest,
              platform: manylinux-x86_64,
              target: x86_64-unknown-linux-gnu,
              manylinux: '2014'
            }
          - {
              host: ubuntu-24.04-arm,
              platform: manylinux-aarch64,
              target: aarch64-unknown-linux-gnu,
              manylinux: '2014'
            }
          - {
              host: ubuntu-latest,
              platform: musllinux-x86_64,
              target: x86_64-unknown-linux-musl,
              manylinux: musllinux_1_2,
              container: 'quay.io/pypa/musllinux_1_2_x86_64:latest',
              musl: true
            }
          - {
              host: ubuntu-24.04-arm,
              platform: musllinux-aarch64,
              target: aarch64-unknown-linux-musl,
              manylinux: musllinux_1_2,
              container: 'quay.io/pypa/musllinux_1_2_aarch64:latest',
              musl: true
            }
          - {
              host: macos-15-intel,
              platform: macos-x86_64,
              target: x86_64-apple-darwin,
              macos: '10.12'
            }
          - {
              host: macos-latest,
              platform: macos-arm64,
              target: aarch64-apple-darwin,
              macos: '11.0'
            }
          - { host: windows-latest, platform: windows-x64, target: x86_64-pc-windows-msvc }
          # The first CPython built for Windows on ARM is 3.13, which tests the
          # stable ABI's wheel there.
          - {
              host: windows-11-arm,
              platform: windows-arm64,
              target: aarch64-pc-windows-msvc,
              stable-python: '3.13'
            }
          - {
              host: windows-latest,
              platform: windows-x86,
              target: i686-pc-windows-msvc,
              arch: x86,
              stable-only: true
            }

    defaults:
      run:
        shell: bash
        working-directory: ./packages/python

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: stable
        with:
          python-version: ${{ matrix.stable-python || '3.11' }}
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@v6
        id: free
        if: ${{ !matrix.stable-only }}
        with:
          python-version: 3.14t
      # The notices of the crates the module links, which every wheel ships
      # beside it.
      - name: Write the third-party notices
        env:
          PYTHON: ${{ steps.stable.outputs.python-path }}
        run: '"$PYTHON" tool/notices.py'
      # The PyPA's containers keep every CPython under
      # `/opt/python/<python tag>-<abi tag>`; elsewhere the wheels are built for
      # the interpreters set up above.
      - name: Name the interpreters
        id: interpreters
        env:
          STABLE: ${{ steps.stable.outputs.python-path }}
          FREE: ${{ steps.free.outputs.python-path }}
          CONTAINER: ${{ matrix.manylinux }}
        run: |
          if [ -n "$CONTAINER" ]; then
            echo "list=/opt/python/cp311-cp311/bin/python /opt/python/cp314-cp314t/bin/python" >> "$GITHUB_OUTPUT"
          else
            echo "list=$STABLE $FREE" >> "$GITHUB_OUTPUT"
          fi
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}
          args: --release --out dist --interpreter ${{ steps.interpreters.outputs.list }}
      - name: List the wheels
        run: ls -l dist
      - name: Test the stable ABI's wheel
        if: ${{ !matrix.musl }}
        env:
          PYTHON: ${{ steps.stable.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install pytest
          "$PYTHON" -m pip install --no-index --find-links dist darudb
          "$PYTHON" -m pytest
      - name: Test the free-threaded wheel
        if: ${{ !matrix.musl && !matrix.stable-only }}
        env:
          PYTHON: ${{ steps.free.outputs.python-path }}
        run: |
          "$PYTHON" -m pip install pytest
          "$PYTHON" -m pip install --no-index --find-links dist darudb
          "$PYTHON" -m pytest
      # The runner is glibc's, so a musl wheel is tested in Alpine.
      - name: Test the stable ABI's wheel on musl
        if: matrix.musl
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/io" -w /io/packages/python python:3.11-alpine sh -c '
            pip install pytest &&
            pip install --no-index --find-links dist darudb &&
            python -m pytest -p no:cacheprovider
          '
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.platform }}
          path: packages/python/dist/*.whl
          if-no-files-found: error

  python:
    if: needs.version.outputs.package == 'python'
    needs: [version, build-python]
    runs-on: ubuntu-latest
    name: Package for PyPI

    defaults:
      run:
        working-directory: ./packages/python

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          merge-multiple: true
          path: packages/python/dist
      # The source distribution holds the engine's crates too, so that pip
      # can build the package where no wheel fits, with a Rust toolchain.
      - run: python -m pip install maturin twine
      - name: Build the source distribution
        run: maturin sdist --out dist
      # Every platform's two wheels but 32-bit Windows's one, and the source.
      - name: Check every distribution is there and complete
        run: |
          ls -l dist
          count=$(ls dist/*.whl | wc -l)

          if [ "$count" -ne 17 ]; then
            echo "::error::$count wheels, not 17"
            exit 1
          fi

          twine check --strict dist/*

          for wheel in dist/*.whl; do
            for file in darudb/THIRD_PARTY_NOTICES.txt LICENSE; do
              if ! python -m zipfile -l "$wheel" | grep -q "$file"; then
                echo "::error::$wheel lacks $file"
                exit 1
              fi
            done
          done
      - name: List what the distributions contain
        run: |
          for wheel in dist/*.whl; do
            python -m zipfile -l "$wheel"
          done

          tar -tzf dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: packages/python/dist/*
          if-no-files-found: error

  # Publishes through PyPI's trusted publishing: the project trusts this
  # workflow of this repository in the `pypi` environment, so PyPI takes the
  # run's OIDC token in place of a secret, and the action uploads an
  # attestation that ties each file to this run. Its own job, so that the
  # jobs that install and build third-party code never hold the permission to
  # ask for that token. A file PyPI has already is skipped, so a run that
  # failed part of the way can run again.
  python-publish:
    if: needs.version.outputs.package == 'python' && needs.version.outputs.publish == 'true'
    needs: [version, python]
    runs-on: ubuntu-latest
    name: Publish to PyPI
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # Its own job, so that the jobs that install and build third-party code
  # never hold a token that can write to the repository.
  github-release:
    if: needs.version.outputs.publish == 'true' && !cancelled() && !failure()
    needs:
      [
        version,
        crate,
        crate-publish,
        npm,
        npm-publish,
        dart,
        dart-generator,
        python,
        python-publish
      ]
    runs-on: ubuntu-latest
    name: Tag and release on GitHub
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # A Dart release holds the native libraries that the published package
      # downloads, under the names its manifest gives them.
      - uses: actions/download-artifact@v8
        if: needs.version.outputs.package == 'dart'
        with:
          pattern: dart-library-*
          merge-multiple: true
          path: libraries
      # The release notes are the changelog's section for the version.
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          TAG: ${{ needs.version.outputs.tag }}
          TITLE: ${{ needs.version.outputs.title }}
        run: |
          awk -v heading="## v$VERSION " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$CHANGELOG" > notes.md
          files=()

          if [ -d libraries ]; then
            files=(libraries/*)
          fi

          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md "${files[@]}"

  # After the GitHub release, whose libraries the published `darudb`
  # downloads. pub.dev takes the run's OIDC token, which `setup-dart` sets up,
  # only from a run a tag push started, and only for a package whose admin
  # page names this repository, the tag pattern and the `pub.dev` environment.
  pub-dev:
    if: github.event_name == 'push' && !cancelled() && !failure()
    needs: [version, github-release]
    runs-on: ubuntu-latest
    name: Publish to pub.dev
    environment: pub.dev
    permissions:
      id-token: write

    steps:
      - uses: dart-lang/setup-dart@v1
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.version.outputs.package == 'dart' && 'dart-package' || 'dart-generator-package' }}
          path: package
      - name: Publish
        working-directory: package
        run: dart pub publish --force
