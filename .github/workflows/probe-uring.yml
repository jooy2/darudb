name: probe-uring

# Probe only, on a branch that is never merged: what a commit's scattered
# writes would cost submitted through io_uring instead of a call each.

on:
  push:
    branches: [investigate/linux-perf]
    paths: [bench/probe/uring.c, .github/workflows/probe-uring.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        run: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q liburing-dev
          cc -O2 bench/probe/uring.c -luring -o uring
      - name: Probe
        run: |
          lscpu | grep -E 'Model name'
          uname -r
          ./uring "$RUNNER_TEMP/uring.bin"
