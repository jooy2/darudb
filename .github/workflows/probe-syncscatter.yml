name: probe-syncscatter

# Probe only, on a branch that is never merged: what a sync commit's barrier
# costs after scattered writes, against one run of pages and a log.

on:
  push:
    branches: [investigate/linux-perf]
    paths: [bench/probe/syncscatter.c, .github/workflows/probe-syncscatter.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      matrix:
        run: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - name: Probe
        run: |
          lscpu | grep -E 'Model name'
          findmnt -T "$RUNNER_TEMP"
          cc -O2 bench/probe/syncscatter.c -o syncscatter
          ./syncscatter "$RUNNER_TEMP"
