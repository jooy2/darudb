name: run-test-samples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      # The samples run the engine and both bindings from this checkout, so a
      # change to any of them is a change to what these tests run.
      - crates/**
      - packages/node/**
      - packages/dart/**
      - samples/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/run-test-samples.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  node:
    runs-on: ubuntu-latest
    name: Test the Node.js sample in Electron and in Chromium

    defaults:
      run:
        working-directory: ./samples/node

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/node/package-lock.json
            samples/node/package-lock.json
      - uses: Swatinem/rust-cache@v2
      # The sample depends on the package in this checkout, which loads the
      # addon `npm run build` writes beside it.
      - name: Build the addon
        working-directory: ./packages/node
        run: |
          npm ci
          npm run build
      - run: npm ci
      # Electron unpacks its binary on first use, and Chromium's sandbox
      # helper has to be owned by root and setuid, which npm cannot do, or
      # the window shows no web content.
      - name: Install Electron and Chromium
        run: |
          node node_modules/electron/install.js
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          npx playwright install --with-deps chromium
      - name: Check types and formatting
        run: |
          npm run typecheck
          npm run format
      # The runner has no display.
      - name: Test
        run: xvfb-run -a npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: node-sample-report
          path: |
            samples/node/playwright-report
            samples/node/test-results

  flutter:
    runs-on: ubuntu-latest
    name: Test the Flutter sample on Linux

    defaults:
      run:
        working-directory: ./samples/flutter

    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # What a Flutter app for Linux builds with, and a display for it. The
      # build hook compiles the engine with the toolchain
      # `packages/dart/darudb/native/rust-toolchain.toml` pins, which rustup
      # installs on the first build.
      - name: Install the Linux build tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - run: flutter pub get
      - name: Generate the model's part
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Unit tests
        run: flutter test
      - name: End-to-end tests
        run: xvfb-run -a flutter test integration_test -d linux
