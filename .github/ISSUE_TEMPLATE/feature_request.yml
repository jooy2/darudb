name: ✨ Feature request
description: Something the database should be able to do and cannot.
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please write the issue in English so everyone can follow it.

        If you are not sure yet whether this is a feature or a question about how to do something already, [Discussions](https://github.com/jooy2/darudb/discussions) is the better place to start.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I checked the documentation and this is not already possible.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where the database stops you. Describe the situation rather than the API you have in mind — the best solution is often not the one either of us thought of first.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour, and — if you have one in mind — the shape of the API in the language you use. Code that does not exist yet is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you are doing instead
      description: The workaround you have now, if any, and why it is not enough.
    validations:
      required: false

  - type: dropdown
    id: languages
    attributes:
      label: Which languages does it concern?
      description: Every feature lives in the Rust core and reaches each language through its binding, so this is about which API you would call it from.
      multiple: true
      options:
        - Rust
        - Node.js
        - Dart
        - Python
        - All of them
    validations:
      required: true
