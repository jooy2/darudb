name: darudb
description: An embedded database that keeps an application's data in one local file. The Dart binding of the DaruDB engine.
version: 1.0.1
repository: https://github.com/jooy2/darudb
homepage: https://darudb.cdget.com

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  crypto: ^3.0.6
  ffi: ^2.2.0
  hooks: ^2.2.0
  meta: ^1.17.0
  native_toolchain_rust: ^1.0.7

dev_dependencies:
  build_runner: ^2.10.0
  darudb_generator:
    path: ../darudb_generator
  lints: ^6.1.0
  test: ^1.30.0
