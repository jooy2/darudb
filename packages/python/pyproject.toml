[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "darudb"
version = "1.0.0"
description = "An embedded database that keeps an application's data in one local file. The Python binding of the DaruDB engine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CDGet", email = "jooy2.contact@gmail.com" }]
keywords = ["database", "embedded", "local", "storage", "encryption"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Database",
  "Topic :: Database :: Database Engines/Servers",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://darudb.cdget.com"
Documentation = "https://darudb.cdget.com/guide/getting-started"
Repository = "https://github.com/jooy2/darudb"
Issues = "https://github.com/jooy2/darudb/issues"
Changelog = "https://github.com/jooy2/darudb/blob/main/packages/python/CHANGELOG.md"

[tool.maturin]
# The package is the Python code under `python/`, with the native module built
# from this crate inside it, as `darudb._native`.
python-source = "python"
module-name = "darudb._native"
# Refuse a wheel tag PyPI would refuse, rather than find out on upload.
compatibility = "pypi"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that leaves a warning behind fails, so that a resource the package
# forgot to close shows up here rather than in an application.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# A database's `with` and a transaction's `with` nested show two scopes, the
# file's and the transaction's, which one combined statement hides.
ignore = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["darudb", "models"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["python/darudb", "tests/typing"]
