name: darudb_sample
description: A sample app of DaruDB for Flutter, with end-to-end tests that run it on a desktop.
# A sample in the DaruDB repository, never a package of its own.
publish_to: none
version: 1.0.0+1

# plass_ui's minimums, which are above the darudb package's.
environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # The repository's own package, so the app runs the engine as it is in
  # this checkout: its build hook compiles the Rust crate for the target.
  darudb:
    path: ../../packages/dart/darudb
  path_provider: 2.1.6
  plass_ui: 1.8.1
  randino: 1.3.1

dev_dependencies:
  build_runner: 2.15.1
  darudb_generator:
    path: ../../packages/dart/darudb_generator
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
